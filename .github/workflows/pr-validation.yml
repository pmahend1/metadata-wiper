name: PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, test and lint
        run: ./gradlew assembleDebug :metadata:test testDebugUnitTest lintDebug

      # A dependency can add INTERNET through manifest merging, so check the merged result.
      - name: Check merged manifest has no INTERNET permission
        run: |
          ./gradlew :app:processReleaseMainManifest
          manifests=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml)
          if [ -z "$manifests" ]; then
            echo "Merged release manifest not found"
            exit 1
          fi
          if grep -l 'android.permission.INTERNET' $manifests; then
            echo "The merged manifest declares android.permission.INTERNET"
            exit 1
          fi
